server {
    listen       80;
    server_name  localhost;

    # Serve the front end and static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # API endpoint to dynamically retrieve the list of game directories
    location /api/games_list/ {
        alias /usr/share/nginx/html/;
        index _non_existent_file_;
        autoindex on;
        autoindex_format json;
    }
}
